# SwiftLint configuration for ChatDemo
# Aura Chat iOS app

disabled_rules:
  - line_length          # SwiftUI views often have long lines
  - type_body_length     # Views can be large
  - file_length          # View files with multiple components
  - function_body_length # Some functions are long by necessity
  - cyclomatic_complexity # Some views have complex conditionals

opt_in_rules:
  - empty_count
  - explicit_init
  - redundant_type_annotation
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces
  - vertical_parameter_alignment_on_call
  - vertical_parameter_alignment_on_definition
  - vertical_parameter_alignment_on_call
  - vertical_parameter_alignment_on_definition

inclusive_language:
  violations:
    - blacklist
    - whitelist
    - master
    - slave

# Custom rules for Aura Chat design system consistency
custom_rules:
  design_system_colors:
    name: "Use Design System colors"
    regex: 'Color\.(red|blue|green|orange|purple|pink|yellow|gray|black|white)\\b'
    message: "Use the Aura Chat Design System colors (e.g., Color.auraPrimary) instead of system colors."
    severity: warning

  no_emoji_in_text:
    name: "No emojis in text labels"
    regex: "\\p{So}"
    message: "Avoid emojis in text; use SF Symbols instead."
    severity: warning

identifier_name:
  excluded:
    - id
    - url
    - ui

trailing_whitespace: {}
unused_parameter: {}
unused_import: {}
unused_declaration: {}
